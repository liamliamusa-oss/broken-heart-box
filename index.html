<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အဆင့်မြင့် အင်္ဂလိပ် - မြန်မာ အဘိဓာန်</title>
    <style>
        body {
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 420px;
            text-align: center;
        }
        h2 {
            color: #d1477a;
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ffb6c1;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #d1477a;
        }
        button {
            background-color: #ff69b4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #d1477a;
        }
        .result-box {
            border-left: 5px solid #ff69b4;
            background-color: #fff0f5;
            padding: 15px;
            text-align: left;
            border-radius: 0 10px 10px 0;
            min-height: 120px;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .audio-btn {
            background-color: #9c27b0;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-top: 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: none;
            cursor: pointer;
        }
        .audio-btn:hover {
            background-color: #7b1fa2;
        }
        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Eng to Myanmar Dictionary</h2>
    <div class="search-box">
        <input type="text" id="wordInput" placeholder="အင်္ဂလိပ်စာလုံး / စကားစု ရိုက်ပါ...">
        <button onclick="searchWord()">ရှာမည်</button>
    </div>
    
    <div class="result-box" id="meaningDisplayBox">
        မည်သည့် အင်္ဂလိပ်စာလုံး သို့မဟုတ် စကားစုမဆို ရှာဖွေနိုင်ပါသည်။
    </div>
</div>

<script>
let lastSearchedWord = "";

async function searchWord() {
    let wordInput = document.getElementById('wordInput').value.trim();
    const meaningBox = document.getElementById('meaningDisplayBox');

    if (!wordInput) {
        meaningBox.innerText = "ကျေးဇူးပြု၍ စကားလုံး သို့မဟုတ် စကားစု တစ်ခုခု ရိုက်ထည့်ပါ!";
        return;
    }

    lastSearchedWord = wordInput; // ရိုက်လိုက်တဲ့ စာသားအကုန်လုံး (ဥပမာ- blood pressure) ကို မှတ်ထားမယ်
    meaningBox.innerHTML = '<span class="loading">မြန်မာလို တိုက်ရိုက်ဘာသာပြန်နေပါသည်...</span>';

    try {
        // စကားလုံးရော စကားစုပါ တိတိကျကျ မြန်မာပြန်ပေးနိုင်ဖို့ Google Translate စနစ်ကို တိုက်ရိုက်သုံးမယ်
        const translateUrl = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=my&dt=t&q=${encodeURIComponent(wordInput)}`;
        const transResponse = await fetch(translateUrl);
        const transData = await transResponse.json();
        
        let mmMeaning = "";
        if (transData && transData[0]) {
            transData[0].forEach(sentence => {
                if (sentence[0]) mmMeaning += sentence[0];
            });
        }

        // မျက်နှာပြင်ပေါ်မှာ ရလဒ်ပြသခြင်း
        meaningBox.innerHTML = `
            <strong>ရှာဖွေသည့် စကားလုံး:</strong> <span style="color:#d1477a; font-weight:bold; font-size:18px;">${wordInput}</span><br>
            
            <button class="audio-btn" onclick="speakWord()">🔊 အသံထွက်နားထောင်မည်</button>
            <br><br>
            
            <strong>မြန်မာပြန် အဓိပ္ပာယ်:</strong><br> 
            <span style="color:#222; font-weight:500; font-size:17px;">${mmMeaning}</span>
        `;

        // အလိုအလျောက် အသံထွက်ခိုင်းမယ်
        speakWord();

    } catch (error) {
        console.error(error);
        meaningBox.innerText = "စနစ်ချို့ယွင်းမှု ဖြစ်ပေါ်နေပါသည်။ အင်တာနက်ချိတ်ဆက်မှုကို စစ်ဆေးပါ။";
    }
}

// ရိုက်သမျှ စကားစုအကုန်လုံးကို အသံထွက်ပေးမည့် စနစ်
function speakWord() {
    if (lastSearchedWord) {
        window.speechSynthesis.cancel(); // အသံဟောင်းတွေကို အရင်ပိတ်မယ်
        const utterance = new SpeechSynthesisUtterance(lastSearchedWord);
        utterance.lang = 'en-US';
        utterance.rate = 0.85; // သဲသဲကွဲကွဲဖြစ်အောင် အသံကို နည်းနည်းလေး နှေးပေးထားတယ်
        window.speechSynthesis.speak(utterance);
    }
}
</script>
</body>
</html>
